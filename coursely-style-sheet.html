<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coursely – Color palette & typography</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F8FC;--card:#fff;--tx:#171A35;--tx2:#777D91;--bd:#E9EAF1;--line:#F0F1F6;--ind:#6259E8;--lav:#F0EEFF;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0F1126;--card:#181B38;--tx:#ECEDF7;--tx2:#9297B0;--bd:#2A2E52;--line:#22264A;--lav:#26255A;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:40px 24px 60px}
.wrap{max-width:1280px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.logo{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:800;letter-spacing:-.03em}.logo em{font-style:normal;color:#35C9A5}
.note{color:var(--tx2);font-size:14px;font-weight:600}
.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:24px;align-items:start}
.card{background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:36px 40px;margin-bottom:24px}
.chip{display:inline-block;font-weight:800;border-radius:14px}
.big{background:var(--ind);color:#fff;font-size:32px;padding:10px 20px}
.sub{background:var(--lav);color:var(--ind);font-size:20px;padding:8px 18px;margin-top:12px}
.rows{margin-top:34px}
.row{display:flex;align-items:baseline;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0;padding-bottom:0}
.row b{color:var(--ind);font-weight:inherit;margin-right:.35em}
.row .s{flex:1;min-width:0}
.row small{color:var(--tx2);font-size:12px;font-weight:600;white-space:nowrap}
.face{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.face .aa{font-size:110px;line-height:1;font-weight:800;color:var(--ind)}
.face p{font-size:13px;font-weight:600;color:var(--tx2);margin-top:6px}
.face p.w{color:var(--ind)}
h3{font-size:15px;font-weight:800;color:var(--ind);margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sw{height:104px;border-radius:16px;border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,box-shadow .15s;font-family:inherit;width:100%}
.sw:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(23,26,53,.15)}
.sw:focus-visible{outline:2px solid var(--ind);outline-offset:2px}
.sw b{font-size:17px;font-weight:700}.sw span{font-size:11px;font-weight:600;opacity:.85;margin-top:4px}
.hint{color:var(--tx2);font-size:12.5px;margin-top:18px}
#t{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#171A35;color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#t.on{opacity:1}
@media(max-width:980px){.cols{grid-template-columns:1fr}}
@media(max-width:560px){.card{padding:24px 20px}.row{flex-wrap:wrap;gap:4px}.row small{width:100%}.big{font-size:26px}}
</style></head><body><div class="wrap">
<header><div class="logo"><svg viewBox="0 0 36 36" width="40" height="40" aria-hidden="true"><rect width="36" height="36" rx="11" fill="#6259E8"/><path d="M24.6 13.4A8 8 0 1 0 24.6 22.6" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><circle cx="25.2" cy="18" r="2.7" fill="#35C9A5"/></svg><span>Course<em>ly</em></span></div><div class="note">Color palette & typography · Manrope, with Inter as backup</div></header>
<div class="cols"><div id="left"></div><div class="card" id="colors"><span class="chip big">Colors</span></div></div></div>
<div id="t" role="status"></div>
<script>
const rows=[["H1","Learn Beyond Limits","Page heading",32,40,800,"-0.02em"],["H2","Continue learning","Section heading",22,30,700,"-0.01em"],["H3","Advanced React Development","Card heading",16,24,700,0],["H4","Priya Nair · 24h · 86 lessons","Subheading",14,20,700,0],["p","Learn hooks, performance and testing.","Body",14,22,400,0],["cap","Updated Oct 2026 · 4.8 rating","Caption",12,18,400,0]];
const mob=rows.map(r=>r.slice()); mob[0][3]=25; mob[0][4]=32; mob[1][3]=20; mob[1][4]=28;
const wn={800:"ExtraBold 800",700:"Bold 700",400:"Regular 400"};
const sec=(l,d)=>`<div class="card"><span class="chip big">Typography</span><br><span class="chip sub">${l}</span><div class="rows">${d.map(r=>`<div class="row"><div class="s" style="font-size:${r[3]}px;line-height:${r[4]}px;font-weight:${r[5]};letter-spacing:${r[6]}"><b style="font-weight:${r[5]>500?r[5]:500}">${r[0]}</b>${r[1]}</div><small>${r[2]} · ${r[3]} / ${r[4]} · ${wn[r[5]]}</small></div>`).join("")}</div></div>`;
document.getElementById("left").innerHTML=sec("Desktop",rows)+sec("Mobile",mob)+`<div class="card"><span class="chip sub" style="margin:0">Typeface</span><div class="face" style="margin-top:22px"><div class="aa">Aa</div><div><div style="font-size:34px;font-weight:800">Manrope</div><p>ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789</p><p class="w">500 Medium · 600 Semibold · 700 Bold · 800 ExtraBold · Fallback: Inter, system-ui</p></div></div></div>`;
const G=[["Primary",[["Midnight Navy","#171A35"],["Royal Indigo","#6259E8"],["Soft Lavender","#F0EEFF"],["White","#FFFFFF"]]],["Secondary",[["Mint Green","#35C9A5"],["Soft Mint","#E7F8F2"],["Warm Amber","#FFBE55"],["Soft Peach","#FFF1E8"],["Light Blue","#EAF2FF"]]],["Neutral",[["Background","#F7F8FC"],["Card","#FFFFFF"],["Primary Text","#20243A"],["Secondary Text","#777D91"],["Border","#E9EAF1"]]],["Status",[["Success","#14906F"],["Warning","#C46A12"],["Info","#2F6FD6"],["Error","#E5484D"]]]];
const lum=h=>{const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const ink=(h,g)=>g=="Status"||lum(h)<.18?"#fff":"#171A35";
document.getElementById("colors").insertAdjacentHTML("beforeend",G.map(([g,a])=>`<h3>${g}</h3><div class="grid">${a.map(([n,h])=>`<button class="sw" data-h="${h}" aria-label="Copy ${n} ${h}" style="background:${h};color:${ink(h,g)}"><b>${h}</b><span>${n}</span></button>`).join("")}</div>`).join("")+`<p class="hint">Click any swatch to copy its HEX code.</p>`);
const t=document.getElementById("t");
document.addEventListener("click",e=>{const s=e.target.closest(".sw");if(!s)return;const h=s.dataset.h;(navigator.clipboard?navigator.clipboard.writeText(h):Promise.reject()).catch(()=>{}).finally(()=>{t.textContent="Copied "+h;t.className="on";setTimeout(()=>t.className="",1400)})});
</script></body></html>
